<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover 讓 iOS 劉海/小白棒機型可使用 safe-area-inset -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="一杯清水，與你自己建立的文字冰塊。點一下上浮，再點一下融化。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f9fc">
  <title>文字冰塊</title>
  <!-- 自包含 SVG favicon（data URI，無外部請求，GitHub Pages 子路徑 / file:// 皆可用） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='9' y='13' width='46' height='42' rx='11' fill='%23cfe6f2' opacity='.9'/%3E%3Crect x='17' y='21' width='30' height='18' rx='6' fill='%23ffffff' opacity='.75'/%3E%3Crect x='22' y='44' width='16' height='4' rx='2' fill='%23ffffff' opacity='.55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- defer：HTML 解析完成後才執行，可安全查詢 DOM；無 inline JS -->
  <script src="app.js" defer></script>
</head>
<body>

  <!-- 主畫面：白色舞台 + 玻璃杯 -->
  <main class="stage" id="stage">
    <h1 class="visually-hidden">文字冰塊</h1>

    <div class="glass-scene">
      <!-- 杯子名稱（選填）：僅在使用者輸入非空白文字時顯示。
           純文字、無任何容器視覺；空白時 hidden → 完全退出 layout，
           主畫面回到沒有名稱時的原版構圖。 -->
      <p class="glass-title" id="glassTitle" hidden></p>

      <!-- 地面柔和投影，讓杯子站得住 -->
      <div class="glass-shadow" aria-hidden="true"></div>

      <div class="glass">
        <!-- 杯口橢圓（微微俯視的透視暗示） -->
        <div class="glass-rim" aria-hidden="true"></div>

        <div class="glass-inner">
          <!-- 水體與水面（純裝飾，不接收指標事件） -->
          <div class="water" aria-hidden="true">
            <div class="water-surface"></div>
          </div>

          <!-- 冰塊圖層：所有冰塊按鈕掛在這裡（JS 動態產生） -->
          <div class="ice-layer" id="iceLayer"></div>

          <!-- 玻璃正面反光：蓋在冰塊之上，讓冰塊看起來在「杯子裡面」 -->
          <div class="glass-front" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <!-- 低調控制區：聲音開關 + 管理冰塊 -->
    <div class="controls">
      <button type="button" id="soundToggle" class="icon-btn" aria-label="聲音開關" aria-pressed="true">
        <svg class="icon-on" viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6.6 8.5H3.5v7h3.1L11 19V5Z"/>
          <path d="M15 9a4.2 4.2 0 0 1 0 6"/>
          <path d="M17.6 6.6a7.6 7.6 0 0 1 0 10.8"/>
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6.6 8.5H3.5v7h3.1L11 19V5Z"/>
          <path d="m16 9.5 5 5"/>
          <path d="m21 9.5-5 5"/>
        </svg>
      </button>

      <button type="button" id="openSettings" class="icon-btn" aria-label="管理文字冰塊" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5.5v13M5.5 12h13"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- 設定面板：原生 dialog（ showModal 提供焦點管理與 Esc 關閉；舊瀏覽器有 fallback ） -->
  <dialog id="settingsDialog" class="settings" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle">文字冰塊</h2>
      <button type="button" id="closeSettings" class="icon-btn small" aria-label="關閉設定">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
        </svg>
      </button>
    </div>

    <!-- 杯子名稱（選填） -->
    <div class="title-field">
      <label class="field-label" for="glassTitleInput">杯子名稱（選填）</label>
      <input id="glassTitleInput" type="text" maxlength="30" placeholder="輸入杯子名稱…"
             autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    </div>

    <!-- 新增冰塊 -->
    <form id="addForm" class="add-form">
      <label class="field-label" for="cubeText">新增冰塊</label>
      <div class="add-row">
        <input id="cubeText" type="text" maxlength="24" placeholder="輸入文字…"
               autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <button type="submit" id="addBtn" class="pill-btn">加入</button>
      </div>

      <!-- 文字顏色：預設色票 + 自訂選色器 -->
      <div class="swatch-row" role="group" aria-label="文字顏色">
        <button type="button" class="swatch is-active" data-color="#2f5d7c" style="--sw:#2f5d7c" aria-label="深藍"></button>
        <button type="button" class="swatch" data-color="#257d7d" style="--sw:#257d7d" aria-label="青綠"></button>
        <button type="button" class="swatch" data-color="#c9584a" style="--sw:#c9584a" aria-label="珊瑚紅"></button>
        <button type="button" class="swatch" data-color="#b07a24" style="--sw:#b07a24" aria-label="琥珀"></button>
        <button type="button" class="swatch" data-color="#6f5a9e" style="--sw:#6f5a9e" aria-label="紫"></button>
        <button type="button" class="swatch" data-color="#3c4a56" style="--sw:#3c4a56" aria-label="墨灰"></button>
        <!-- 自訂顏色：開啟統一 Color Picker（格線 | 光譜 | 滑桿）。
             原生 <input type="color"> 僅保留作為 fallback / 狀態保存，
             正常使用時不會被觸發。 -->
        <button type="button" id="customColorBtn" class="swatch swatch-custom" aria-label="自訂顏色" title="自訂顏色"></button>
        <input type="color" id="cubeColor" value="#2f5d7c" hidden tabindex="-1" aria-hidden="true">
      </div>

      <p id="limitHint" class="hint" hidden>冰塊有點多了，先在下方清單用垃圾桶移除一些，再繼續加。</p>
    </form>

    <!-- 已存在冰塊的清單（可改文字 / 改顏色 / 刪除） -->
    <div class="list-head">
      <span class="field-label">杯中的冰塊</span>
    </div>
    <ul id="cubeList" class="cube-list"></ul>
    <p id="emptyHint" class="hint">杯子還是空的——先加入第一顆冰塊。</p>
  </dialog>

  <!-- 統一 Color Picker：格線 | 光譜 | 滑桿，所有平台同一套自製介面 -->
  <dialog id="colorDialog" class="cp-dialog" aria-labelledby="cpTitle">
    <div class="settings-head">
      <h2 id="cpTitle">自訂顏色</h2>
      <button type="button" id="cpClose" class="icon-btn small" aria-label="關閉選色器">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
        </svg>
      </button>
    </div>

    <!-- 目前顏色預覽 -->
    <div class="cp-preview">
      <span class="cp-preview-swatch" id="cpPreview" aria-hidden="true"></span>
      <span class="cp-preview-hex" id="cpHexLabel">#2F5D7C</span>
    </div>

    <div class="cp-tabs" role="tablist" aria-label="選色模式">
      <button type="button" class="cp-tab" id="cpTabGrid" role="tab" aria-selected="true" aria-controls="cpPanelGrid">格線</button>
      <button type="button" class="cp-tab" id="cpTabSpectrum" role="tab" aria-selected="false" aria-controls="cpPanelSpectrum">光譜</button>
      <button type="button" class="cp-tab" id="cpTabSliders" role="tab" aria-selected="false" aria-controls="cpPanelSliders">滑桿</button>
    </div>

    <!-- 格線模式 -->
    <div class="cp-panel" id="cpPanelGrid" role="tabpanel" aria-labelledby="cpTabGrid">
      <div class="cp-grid" id="cpGrid"></div>
    </div>

    <!-- 光譜模式：飽和度 × 明度面板 + 色相滑桿（純 CSS 漸層 + JS 計算） -->
    <div class="cp-panel" id="cpPanelSpectrum" role="tabpanel" aria-labelledby="cpTabSpectrum" hidden>
      <div class="cp-sv" id="cpSV" tabindex="0" role="application"
           aria-label="飽和度與明度面板：點擊或拖曳選色，方向鍵微調">
        <span class="cp-sv-thumb" id="cpSVThumb" aria-hidden="true"></span>
      </div>
      <div class="cp-slider-label">
        <label for="cpHue">色相</label>
        <span class="cp-slider-val" id="cpHueVal">215°</span>
      </div>
      <input type="range" class="cp-hue" id="cpHue" min="0" max="360" step="1" value="215"
             aria-label="色相（0 到 360 度）">
    </div>

    <!-- 滑桿模式：RGB 三通道 + Hex -->
    <div class="cp-panel" id="cpPanelSliders" role="tabpanel" aria-labelledby="cpTabSliders" hidden>
      <div class="cp-rgb-row">
        <label class="cp-ch-label" for="cpR">紅</label>
        <input type="range" class="cp-slider" id="cpR" min="0" max="255" step="1" value="47" aria-label="紅色色階">
        <input type="number" class="cp-num" id="cpRNum" min="0" max="255" value="47" aria-label="紅色數值（0 到 255）">
      </div>
      <div class="cp-rgb-row">
        <label class="cp-ch-label" for="cpG">綠</label>
        <input type="range" class="cp-slider" id="cpG" min="0" max="255" step="1" value="93" aria-label="綠色色階">
        <input type="number" class="cp-num" id="cpGNum" min="0" max="255" value="93" aria-label="綠色數值（0 到 255）">
      </div>
      <div class="cp-rgb-row">
        <label class="cp-ch-label" for="cpB">藍</label>
        <input type="range" class="cp-slider" id="cpB" min="0" max="255" step="1" value="124" aria-label="藍色色階">
        <input type="number" class="cp-num" id="cpBNum" min="0" max="255" value="124" aria-label="藍色數值（0 到 255）">
      </div>
      <div class="cp-hex-row">
        <label class="cp-ch-label" for="cpHex">Hex</label>
        <input type="text" class="cp-hex-in" id="cpHex" value="#2F5D7C" maxlength="7"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               aria-label="Hex 色碼，六位十六進位數字，例如 2F5D7C">
      </div>
    </div>

    <div class="cp-foot">
      <button type="button" class="cp-btn" id="cpCancel">取消</button>
      <button type="button" class="pill-btn" id="cpApply">套用</button>
    </div>
  </dialog>

</body>
</html>
